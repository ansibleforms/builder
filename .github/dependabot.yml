version: 2

# Keeps the npm packages, the image's pins (node, BuildKit, cosign) and the workflow actions up to
# date. Never grouped : one pull request per dependency, majors included (read their changelog).

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
