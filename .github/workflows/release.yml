name: Release

# Releases the builder at the version package.json says, which follows AnsibleForms' (Follow app
# release moves it). Once CI is green on a push to main, and when that version has no release
# yet, it publishes the image for amd64 and arm64 :
#   ghcr.io/ansibleforms/ansibleforms-rte-builder:<version>, :<major>.<minor>, :<major> and :latest
# and creates the release <version> with the changelog's entry. A version released already, or
# 0.0.0 (none followed yet), releases nothing : a change merged between two app releases goes out
# with the next one, listed under Unreleased in CHANGELOG.md.
#
# The release is created with a token of the ansibleforms-release GitHub App, so it is
# ansibleforms[bot]'s, as the app's : it needs the variable RELEASE_APP_CLIENT_ID and the secret
# RELEASE_APP_PRIVATE_KEY in this repository.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "No AnsibleForms release followed yet: nothing to release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$version is released already."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.v.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.v.outputs.skip != 'true'
      - uses: docker/login-action@v4
        if: steps.v.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.v.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/ansibleforms/ansibleforms-rte-builder:${{ steps.v.outputs.version }}
            ghcr.io/ansibleforms/ansibleforms-rte-builder:${{ steps.v.outputs.minor }}
            ghcr.io/ansibleforms/ansibleforms-rte-builder:${{ steps.v.outputs.major }}
            ghcr.io/ansibleforms/ansibleforms-rte-builder:latest

      - uses: actions/create-github-app-token@v3
        id: app
        if: steps.v.outputs.skip != 'true'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create the release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # the changelog's entry of this version, else a line naming the app release it follows
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "The RTE builder of AnsibleForms $VERSION." > notes.md
          gh release create "$VERSION" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "$VERSION" --notes-file notes.md
