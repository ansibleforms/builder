name: PR

# Pull requests are squash-merged, and the squash commit takes the PR title as its message, so it
# has to be a Conventional Commit : the same rule as the app repository (CONTRIBUTING.md).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            security
            docs
            test
            ci
            chore
            build
            style
          subjectPattern: ^[a-z].*$
          subjectPatternError: The subject starts with a lower case letter.

  branch:
    name: Branch
    runs-on: ubuntu-latest
    steps:
      - name: Branch name has a type prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          types='feat|fix|perf|refactor|revert|security|docs|test|ci|chore|build|style'
          # dependabot names its own branches
          if [[ "$BRANCH" =~ ^($types)/.+ || "$BRANCH" =~ ^dependabot/.+ ]]; then
            echo "branch '$BRANCH' is fine"
            exit 0
          fi
          echo "::error::branch '$BRANCH' should be named <type>/<short-description>, with type one of: ${types//|/, }, for example fix/ldap-group-filter"
          exit 1
